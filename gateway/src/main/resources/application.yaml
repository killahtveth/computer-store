server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: core-service
          uri: http://core-service:8081
          predicates:
            - Path=/api/computers/**
        - id: report-service
          uri: http://report-service:8082
          predicates:
            - Path=/api/reports/**