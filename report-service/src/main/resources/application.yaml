server:
  port: 8082

spring:
  application:
    name: report-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none     
    show-sql: true
  liquibase:
    enabled: false        